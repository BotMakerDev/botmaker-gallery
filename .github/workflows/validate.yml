name: Validate

# THE GATE. A pull request that passes is merged by automerge.yml with nobody reading it, so this is the only
# review a Community listing gets. Every rule is com.botmaker.cli.gallery.GalleryGate, resolved from
# botmaker-cli's published library (tools/resolve-cli.sh) — the same checks `botmaker bot publish` runs on the
# author's machine before it opens the pull request.
#
# NOTHING FROM THE PULL REQUEST IS EXECUTED AS CODE except what this repository already holds: a pull request
# only ever adds JSON under bots/. One that changes this workflow, tools/ or anything else outside bots/
# still gets a check — computed by its own copy — and automerge.yml refuses to merge it and hands it to a
# maintainer. That rule, not this file, is what makes a green check trustworthy.
#
# It is not a security review. A bot is a Java program somebody builds and runs; see README.md.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The job id is what automerge.yml looks for among a commit's check runs. Renaming it is a change there too.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Written to a FILE, never into a later `run:` line. A pull request chooses its own filenames, so the list
      # is attacker-controlled text; the gate reads it itself through its `@file` form.
      #
      # The BASE tree beside it, because ownership of an existing listing is read from what the gallery holds
      # today: bots/a-b-c.json is both a-b/c and a/b-c, and the pull request's copy says whatever it likes.
      - name: What this pull request changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p target
          git diff --name-only "$BASE_SHA" HEAD > target/changed.txt
          cat target/changed.txt
          git worktree add --detach target/base "$BASE_SHA"

      - name: Resolve botmaker-cli
        run: tools/resolve-cli.sh target/gate-classpath.txt

      # author_association rather than the collaborator-permission API: a pull request from a fork gets a
      # read-only token, which that endpoint refuses. OWNER, MEMBER and COLLABORATOR are the accounts that can
      # push here.
      - name: Run the gate
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          maintainer=()
          case "$ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR) maintainer=(--maintainer) ;;
          esac
          java -cp "$(cat target/gate-classpath.txt)" com.botmaker.cli.gallery.GalleryGate . \
               --base target/base --author "$AUTHOR" "${maintainer[@]}" @target/changed.txt
